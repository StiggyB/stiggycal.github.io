<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tagebuch</title>
<meta name="description" content="Persönliches Tagebuch – lokal, offline, privat." />
<meta name="theme-color" content="#F3F1EC" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Tagebuch" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" />
<style>
  :root{
    --paper:#F3F1EC; --card:#FBFAF7; --ink:#242019;
    --inkSoft:#6B655B; --line:#E4E0D7; --ring:#C9C3B6;
    --serif:"Fraunces", Georgia, "Times New Roman", serif;
    --sans:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    min-height:100vh; min-height:100dvh;
  }
  body.dragging-active{user-select:none; -webkit-user-select:none}
  #app{display:flex; justify-content:center; min-height:100vh; min-height:100dvh; width:100%}
  .shell{
    width:100%; max-width:28rem; display:flex; flex-direction:column;
    min-height:100vh; min-height:100dvh; position:relative;
  }
  button{font-family:inherit; cursor:pointer; background:none; border:none; color:inherit; padding:0}
  input,textarea{font-family:inherit}
  .serif{font-family:var(--serif)}
  a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{
    outline:2px solid var(--ink); outline-offset:2px; border-radius:8px;
  }
  header.top{
    position:sticky; top:0; z-index:20; display:flex; align-items:center;
    justify-content:space-between; padding:12px 16px;
    padding-top:calc(12px + env(safe-area-inset-top));
    background:var(--paper); border-bottom:1px solid var(--line);
  }
  .row{display:flex; align-items:center}
  .gap1{gap:4px} .gap15{gap:6px} .gap2{gap:8px} .gap25{gap:10px} .gap3{gap:12px}
  .iconbtn{padding:8px; border-radius:999px; display:inline-flex; min-width:44px; min-height:44px; align-items:center; justify-content:center}
  .iconbtn.sm{min-width:36px; min-height:36px; padding:6px}
  .brand{font-family:var(--serif); font-weight:600; font-size:18px}
  main{flex:1; display:flex; flex-direction:column}
  .muted{color:var(--inkSoft)}
  .cal-wrap{flex:1; padding:0 16px 32px}
  .month-nav{display:flex; align-items:center; justify-content:space-between; margin:12px 0 2px}
  .month-title{font-family:var(--serif); font-weight:500; font-size:23px; margin:0; text-align:center; flex:1}
  .subtitle{text-align:center; font-size:13px; color:var(--inkSoft); margin:0 0 8px}
  .controls{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px}
  .seg{display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:2px; background:var(--card)}
  .seg button{font-size:13px; padding:6px 14px; border-radius:999px; color:var(--inkSoft); min-height:32px}
  .seg button.on{background:var(--ink); color:var(--card)}
  .pill-heute{font-size:13px; padding:6px 14px; border-radius:999px; border:1px solid var(--line); color:var(--ink); min-height:32px}
  .chips{display:flex; flex-wrap:wrap; gap:6px; padding-bottom:12px}
  .composer .chips{padding-bottom:8px}
  .chip{flex:1 1 auto; min-width:0; justify-content:center; font-size:12px; padding:6px 10px; border-radius:999px; display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); color:var(--inkSoft); background:transparent; min-height:32px; white-space:nowrap}
  .chip .lbl{overflow:hidden; text-overflow:ellipsis}
  .dot{display:inline-block; width:8px; height:8px; border-radius:999px}
  .dot-sm{width:6px; height:6px}
  .wd-head{display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:4px}
  .wd-head span{text-align:center; font-size:12px; padding:4px 0; color:var(--inkSoft)}
  .grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
  .day{position:relative; border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:6px 0 4px; aspect-ratio:1 / 1.15; min-height:44px; background:var(--card); border:1px solid var(--line)}
  .day.out{background:transparent; opacity:.4}
  .day.today{border-color:var(--ink)}
  .day .num{font-size:14px; color:var(--ink)}
  .day.today .num{font-weight:700}
  .day .dots{display:flex; gap:2px; margin-top:4px; flex-wrap:wrap; justify-content:center; padding:0 4px}
  .day .marks{margin-top:auto; padding:2px 3px 0; font-size:9px; line-height:1.25; font-weight:700; letter-spacing:1.2px; color:var(--inkSoft); text-align:center; word-break:break-word}
  /* Tages-Markierungen (W H S B) */
  .marks-row{display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; padding:10px 16px; border-bottom:1px solid var(--line)}
  .marks-label{font-size:12px; color:var(--inkSoft)}
  .marks-toggles{display:flex; gap:10px; flex-wrap:wrap; margin-left:auto}
  .mstep{display:inline-flex; align-items:center; gap:4px}
  .mtoggle{min-width:36px; height:36px; padding:0 8px; border-radius:10px; border:1px solid var(--line); color:var(--inkSoft); font-weight:700; font-size:14px; display:inline-flex; align-items:center; justify-content:center; gap:2px}
  .mtoggle.on{background:var(--ink); color:var(--card); border-color:var(--ink)}
  .mtoggle .mcount{font-size:11px; font-weight:700; opacity:.9}
  .mdec{width:28px; height:28px; border-radius:8px; border:1px solid var(--line); color:var(--inkSoft); font-size:18px; line-height:1; display:inline-flex; align-items:center; justify-content:center}
  .week-marks{font-size:11px; font-weight:700; letter-spacing:1.5px; color:var(--inkSoft); margin-left:8px}
  /* Stimmung */
  .mood-row{display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--line)}
  .mood-btns{display:flex; gap:8px; margin-left:auto}
  .mood-btn{min-width:38px; height:38px; border-radius:10px; border:1px solid var(--line); font-size:20px; display:inline-flex; align-items:center; justify-content:center; filter:grayscale(1); opacity:.55}
  .mood-btn.on{filter:none; opacity:1; border-color:var(--ink); background:var(--card)}
  .mood-mini{position:absolute; top:2px; right:3px; font-size:9px; line-height:1}
  .week-mood{font-size:14px; line-height:1}
  /* Schreibserie */
  .streak-pill{margin-left:auto; font-size:13px; color:var(--inkSoft); border:1px solid var(--line); border-radius:999px; padding:4px 10px; white-space:nowrap; flex:0 0 auto}
  /* An diesem Tag */
  .otd-card{border-radius:16px; background:var(--card); border:1px solid var(--line); margin-bottom:12px; overflow:hidden}
  .otd-head{width:100%; display:flex; align-items:center; gap:6px; padding:10px 12px; font-size:13px; color:var(--inkSoft); text-align:left; min-height:44px}
  .otd-head .n{margin-left:auto}
  .otd-item{display:block; width:100%; text-align:left; padding:8px 12px 10px; border-top:1px solid var(--line)}
  .otd-when{font-size:12px; color:var(--inkSoft); display:block; margin-bottom:2px}
  .otd-txt{font-size:14px; line-height:1.35; color:var(--ink); margin:0; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
  /* Wochenansicht */
  .week-list{display:flex; flex-direction:column; gap:8px}
  .week-day{display:block; width:100%; text-align:left; border:1px solid var(--line); background:var(--card); border-radius:16px; padding:10px 12px}
  .week-day.today{border-color:var(--ink)}
  .week-day.empty{background:transparent}
  .week-day-head{display:flex; align-items:baseline; gap:8px; margin-bottom:2px}
  .week-dow{font-family:var(--serif); font-size:16px; color:var(--ink)}
  .week-day.today .week-dow{font-weight:600}
  .week-date{font-size:13px; color:var(--inkSoft)}
  .week-count{margin-left:auto; font-size:12px; color:var(--inkSoft)}
  .week-entry{display:flex; align-items:flex-start; gap:8px; padding:3px 0}
  .week-entry .wdot{margin-top:6px; flex:0 0 auto}
  .week-entry .txt{font-size:14px; line-height:1.35; color:var(--ink); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
  .week-entry .time{font-size:12px; color:var(--inkSoft); flex:0 0 auto}
  .week-empty-txt{font-size:13px; color:var(--inkSoft)}
  /* Detail / Sub-Ansichten */
  .sub-head{padding:12px 16px 8px; display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--line)}
  .sub-title{font-family:var(--serif); font-weight:500; font-size:18px; margin:0}
  .scroll{flex:1; overflow-y:auto; padding:12px 16px}
  .entry{border-radius:16px; padding:12px; background:var(--card); border:1px solid var(--line); margin-bottom:10px}
  .entry-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px}
  .cat-tag{font-size:12px; padding:2px 8px; border-radius:999px; display:inline-flex; align-items:center; gap:4px}
  .entry-text{font-size:15px; line-height:1.55; white-space:pre-wrap; color:var(--ink); margin:0}
  .empty{text-align:center; margin-top:40px; color:var(--inkSoft)}
  .empty .big{font-family:var(--serif); font-size:17px; margin:0}
  .composer{padding:8px 12px 12px; padding-bottom:calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:var(--paper)}
  .composer-row{display:flex; align-items:flex-end; gap:8px}
  textarea.ta{flex:1; resize:none; border-radius:16px; padding:10px 14px; font-size:15px; outline:none; background:var(--card); border:1px solid var(--line); color:var(--ink); max-height:160px; line-height:1.45}
  .send{padding:10px; border-radius:999px; flex:0 0 auto; min-width:44px; min-height:44px; display:inline-flex; align-items:center; justify-content:center}
  .hint{font-size:12px; margin:0 0 4px; padding:0 4px; color:#B0843F}
  .link-btn{font-size:12px; margin-top:6px; padding:0 4px; color:var(--inkSoft)}
  .search-box{flex:1; display:flex; align-items:center; gap:8px; border-radius:999px; padding:8px 12px; background:var(--card); border:1px solid var(--line)}
  .search-box input{flex:1; background:transparent; border:none; outline:none; font-size:15px; color:var(--ink)}
  .res-btn{width:100%; text-align:left; border-radius:16px; padding:12px; background:var(--card); border:1px solid var(--line); margin-bottom:8px; display:block}
  .res-meta{display:flex; align-items:center; gap:8px; margin-bottom:4px; font-size:12px; color:var(--inkSoft)}
  .res-text{font-size:15px; line-height:1.35; color:var(--ink); margin:0}
  /* Statistik */
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:6px}
  .stat-tile{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 14px}
  .stat-num{font-family:var(--serif); font-size:26px; line-height:1.05; color:var(--ink)}
  .stat-label{font-size:12px; color:var(--inkSoft); margin-top:4px}
  .stat-section-title{font-size:13px; color:var(--inkSoft); margin:16px 4px 8px; font-weight:500}
  .daybars{display:flex; align-items:flex-end; gap:2px; height:72px; padding:10px; background:var(--card); border:1px solid var(--line); border-radius:16px}
  .daybar{flex:1; background:var(--ring); border-radius:2px 2px 0 0; min-height:3px}
  .daybar.has{background:var(--ink)}
  .daybar.today{background:#B0843F}
  .bar-row{display:flex; align-items:center; gap:10px; margin-bottom:9px}
  .bar-label{font-size:13px; width:92px; flex:0 0 auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:6px; color:var(--ink)}
  .bar-track{flex:1; height:10px; background:var(--paper); border:1px solid var(--line); border-radius:999px; overflow:hidden}
  .bar-fill{display:block; height:100%; border-radius:999px; min-width:3px}
  .bar-count{font-size:12px; color:var(--inkSoft); width:22px; text-align:right; flex:0 0 auto}
  .moodline{padding:10px; background:var(--card); border:1px solid var(--line); border-radius:16px}
  /* Jahres-Heatmap */
  .hm{display:flex; flex-direction:column; gap:3px; padding:10px; background:var(--card); border:1px solid var(--line); border-radius:16px}
  .hm-row{display:grid; grid-template-columns:26px repeat(31,1fr); gap:2px; align-items:center}
  .hm-lab{font-size:10px; color:var(--inkSoft)}
  .hm-cell{aspect-ratio:1/1; min-width:0; width:100%; border-radius:2px; padding:0; border:none}
  .hm-cell.e0{background:var(--paper); box-shadow:inset 0 0 0 1px var(--line)}
  .hm-cell.today{box-shadow:0 0 0 1.5px var(--ink)}
  .hm-legend{display:flex; align-items:center; gap:4px; justify-content:flex-end; margin-top:6px; font-size:11px; color:var(--inkSoft)}
  .hm-legend .sq{width:10px; height:10px; border-radius:2px; display:inline-block}
  /* Kategorien */
  .cat-card{border-radius:16px; padding:10px; background:var(--card); border:1px solid var(--line); margin-bottom:8px}
  .cat-card.dragging{opacity:.9; box-shadow:0 8px 24px rgba(0,0,0,.18); border-color:var(--ring); position:relative; z-index:5}
  .cat-row{display:flex; align-items:center; gap:8px}
  .drag-handle{flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center; width:30px; height:34px; color:var(--ring); touch-action:none; cursor:grab}
  .drag-handle:active{cursor:grabbing}
  .swatch-btn{width:28px; height:28px; border-radius:999px; flex:0 0 auto; border:2px solid #fff}
  .cat-name{flex:1; background:transparent; border:none; outline:none; font-size:15px; color:var(--ink); min-width:0}
  .mini-btn{font-size:12px; padding:4px 8px; border-radius:999px}
  .swatches{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; padding:0 4px 4px}
  .swatch{width:28px; height:28px; border-radius:999px}
  .add-cat{width:100%; display:flex; align-items:center; justify-content:center; gap:8px; padding:12px; border-radius:16px; margin-top:4px; font-size:15px; border:1px dashed var(--ring); color:var(--inkSoft)}
  .note{font-size:12px; margin-top:8px; line-height:1.5; padding:0 4px; color:var(--inkSoft)}
  .backdrop{position:fixed; inset:0; z-index:30; display:flex; align-items:flex-end; justify-content:center; background:rgba(0,0,0,.3)}
  .sheet{width:100%; max-width:28rem; border-radius:24px 24px 0 0; padding:20px 20px 32px; padding-bottom:calc(32px + env(safe-area-inset-bottom)); background:var(--card)}
  .grip{width:40px; height:4px; border-radius:999px; margin:0 auto 16px; background:var(--line)}
  .menu-item{width:100%; display:flex; align-items:center; gap:12px; padding:12px 4px; text-align:left; color:var(--ink); font-size:16px}
  .menu-sep{border-top:1px solid var(--line)}
  /* Login / Gate */
  .gate{flex:1; display:flex; flex-direction:column; justify-content:center; align-items:stretch; padding:28px 24px; gap:12px}
  .gate-brand{display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:6px; color:var(--ink)}
  .gate-brand .b{font-family:var(--serif); font-weight:600; font-size:22px}
  .gate h1{font-family:var(--serif); font-weight:500; font-size:22px; text-align:center; margin:0}
  .gate p.lead{text-align:center; font-size:14px; color:var(--inkSoft); margin:0 4px 6px; line-height:1.5}
  .gate .field{display:flex; flex-direction:column; gap:6px}
  .gate label{font-size:13px; color:var(--inkSoft); padding-left:4px}
  .gate input{width:100%; border-radius:14px; padding:13px 14px; font-size:16px; background:var(--card); border:1px solid var(--line); color:var(--ink); outline:none}
  .gate input:focus{border-color:var(--ring)}
  .gate .primary{background:var(--ink); color:var(--card); padding:14px; border-radius:14px; font-size:16px; font-weight:500; min-height:48px; margin-top:4px}
  .gate .primary:disabled{background:var(--ring)}
  .gate .ghost{color:var(--inkSoft); font-size:14px; padding:8px; min-height:44px}
  .gate .err{color:#C0504D; font-size:13px; text-align:center; min-height:18px; margin:0}
  .gate .warn{background:#B0843F14; border:1px solid #B0843F44; border-radius:14px; padding:12px 14px; font-size:12.5px; color:#7a5b25; line-height:1.5; margin-top:4px}
  .lock-icon{display:flex; justify-content:center; color:var(--inkSoft); margin-bottom:2px}
  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:24px; z-index:40; padding:10px 16px; border-radius:999px; font-size:14px; background:var(--ink); color:var(--card)}
  .hidden{display:none !important}
  @media (prefers-reduced-motion: reduce){*{transition:none!important; animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<input id="fileInput" type="file" accept="application/json" class="hidden" />

<script>
"use strict";
(function () {
  // ---------- Konstanten / Design ----------
  var DEFAULT_CATS = [
    { key: "privat",    label: "Privat",    color: "#5B7DB1" },
    { key: "beziehung", label: "Beziehung", color: "#C86B8A" },
    { key: "kinder",    label: "Kinder",    color: "#E0784E" },
    { key: "smilla",    label: "Smilla",    color: "#9C7B5A" },
    { key: "firma",     label: "Firma",     color: "#B0843F" },
    { key: "freizeit",  label: "Freizeit",  color: "#4FA0A0" },
    { key: "sport",     label: "Sport",     color: "#6BA368" },
    { key: "gedanke",   label: "Gedanke",   color: "#8E7CB0" }
  ];
  var FALLBACK = { key: "_none", label: "Sonstiges", color: "#8E8B84" };
  var MARKERS = ["W", "H", "S", "B"];   // feste Tages-Markierungen (kein Text-Eintrag)
  var MOOD_EMOJI = ["😞","😕","😐","🙂","😄"];
  var MOOD_COLORS = ["#C0504D","#E0784E","#E1B23A","#6BA368","#4C7A6B"];
  var SWATCHES = ["#5B7DB1","#4FA0A0","#6BA368","#8E7CB0","#C86B8A","#C0504D",
                  "#E0784E","#E1B23A","#B0843F","#9C7B5A","#4C7A6B","#7E8B8E"];
  var MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
  var MONTHS_SHORT = ["Jan","Feb","März","Apr","Mai","Juni","Juli","Aug","Sep","Okt","Nov","Dez"];
  var WD = ["Mo","Di","Mi","Do","Fr","Sa","So"];
  var WD_LONG = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];

  // ---------- Datums-Helfer (lokal, keine UTC-Verschiebung) ----------
  function pad(n){ return String(n).padStart(2,"0"); }
  function keyOf(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function parseKey(k){ var p=k.split("-").map(Number); return new Date(p[0], p[1]-1, p[2]); }
  function fmtTime(ts){ return new Intl.DateTimeFormat("de-DE",{hour:"2-digit",minute:"2-digit"}).format(new Date(ts)); }
  function fmtLongDate(k){ var d=parseKey(k); return WD_LONG[(d.getDay()+6)%7]+", "+d.getDate()+". "+MONTHS[d.getMonth()]+" "+d.getFullYear(); }
  function uid(){ return Date.now()+"-"+Math.random().toString(36).slice(2,7); }
  function mondayOf(d){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
  function addDays(d,n){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; }
  function isoWeek(d){
    var date=new Date(d.getFullYear(),d.getMonth(),d.getDate());
    var day=(date.getDay()+6)%7; date.setDate(date.getDate()-day+3);
    var firstTh=new Date(date.getFullYear(),0,4);
    var firstDay=(firstTh.getDay()+6)%7; firstTh.setDate(firstTh.getDate()-firstDay+3);
    return 1+Math.round((date-firstTh)/(7*86400000));
  }

  // ---------- IndexedDB ----------
  var DB_NAME = "tagebuch", DB_VER = 1, _db = null;
  function openDB(){
    return new Promise(function(resolve, reject){
      var req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = function(){
        var db = req.result;
        if(!db.objectStoreNames.contains("entries")){
          var s = db.createObjectStore("entries", { keyPath: "id" });
          s.createIndex("date", "date", { unique:false });
        }
        if(!db.objectStoreNames.contains("prefs")){
          db.createObjectStore("prefs", { keyPath: "key" });
        }
      };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
  }
  function tx(store, mode){ return _db.transaction(store, mode).objectStore(store); }
  function pReq(r){ return new Promise(function(res,rej){ r.onsuccess=function(){res(r.result);}; r.onerror=function(){rej(r.error);}; }); }
  function dbGetAll(store){ return pReq(tx(store,"readonly").getAll()); }
  function dbGet(store,key){ return pReq(tx(store,"readonly").get(key)); }
  function dbPut(store,val){ return pReq(tx(store,"readwrite").put(val)); }
  function dbDelete(store,key){ return pReq(tx(store,"readwrite").delete(key)); }

  // ---------- Verschlüsselung (Web Crypto: PBKDF2 -> AES-GCM-256) ----------
  var subtle = (window.crypto && window.crypto.subtle) ? window.crypto.subtle : null;
  function rndBytes(n){ var a=new Uint8Array(n); window.crypto.getRandomValues(a); return a; }
  function b64(bytes){ var a=new Uint8Array(bytes), s=""; for(var i=0;i<a.length;i++) s+=String.fromCharCode(a[i]); return btoa(s); }
  function fromB64(str){ var s=atob(str), a=new Uint8Array(s.length); for(var i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a; }
  async function deriveKey(password, salt, iterations){
    var base = await subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    return subtle.deriveKey({ name:"PBKDF2", salt:salt, iterations:iterations, hash:"SHA-256" },
      base, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
  }
  async function encJSON(key, obj){
    var iv = rndBytes(12);
    var data = new TextEncoder().encode(JSON.stringify(obj));
    var ct = await subtle.encrypt({ name:"AES-GCM", iv:iv }, key, data);
    return { iv:b64(iv), ct:b64(new Uint8Array(ct)) };
  }
  async function decJSON(key, blob){
    var pt = await subtle.decrypt({ name:"AES-GCM", iv:fromB64(blob.iv) }, key, fromB64(blob.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  // ---------- Verschlüsselte Persistenz ----------
  async function putEntry(rec){
    var enc = await encJSON(sessionKey, { date:rec.date, ts:rec.ts, text:rec.text, cat:rec.cat, mod:rec.mod });
    await dbPut("entries", { id:rec.id, enc:enc });
  }
  async function loadAllEntries(){
    var raw = await dbGetAll("entries") || [];
    var out = [];
    for(var i=0;i<raw.length;i++){
      var r = raw[i];
      if(r && r.enc){ try{ var p = await decJSON(sessionKey, r.enc); out.push({ id:r.id, date:p.date, ts:p.ts, text:p.text, cat:p.cat, mod:p.mod||p.ts }); }catch(e){} }
    }
    return out;
  }
  async function saveCatsEnc(){
    await dbPut("prefs", { key:"cats", enc: await encJSON(sessionKey, S.cats) });
  }

  // ---------- Online-Speicher (Sync mit privatem GitHub-Repository) ----------
  // Hochgeladen wird ausschließlich Ciphertext: Die Nutzdaten sind mit einem
  // zufälligen Sync-Schlüssel verschlüsselt, der selbst nur „verpackt"
  // (mit dem Tagebuch-Passwort verschlüsselt) in der Sync-Datei liegt.
  var SYNC_FILE = "tagebuch-sync.json";
  var SYNC_DEBOUNCE_MS = 4000;
  var SYNC_REFRESH_MS = 60000;
  var SY = { cfg:null, key:null, busy:false, again:false, dirty:false,
             lastOk:0, lastErr:"", timer:null, warned:false };
  var syncMeta = { tomb:{}, marksTs:{}, moodsTs:{}, catsMod:0 };

  function freshSyncMeta(){ return { tomb:{}, marksTs:{}, moodsTs:{}, catsMod:0 }; }
  function normalizeSyncMeta(o){
    o = (o && typeof o==="object") ? o : {};
    function numMap(m){
      var out={}; if(!m || typeof m!=="object") return out;
      Object.keys(m).forEach(function(k){ var v=+m[k]; if(v>0) out[k]=v; });
      return out;
    }
    return { tomb:numMap(o.tomb), marksTs:numMap(o.marksTs), moodsTs:numMap(o.moodsTs),
             catsMod:(+o.catsMod>0 ? +o.catsMod : 0) };
  }
  async function saveSyncMetaEnc(){
    if(sessionKey) await dbPut("prefs", { key:"syncmeta", enc: await encJSON(sessionKey, syncMeta) });
  }
  async function saveSyncCfgEnc(){
    if(!sessionKey) return;
    if(SY.cfg) await dbPut("prefs", { key:"sync", enc: await encJSON(sessionKey, SY.cfg) });
    else await dbDelete("prefs","sync");
  }
  async function loadSyncState(){
    syncMeta = freshSyncMeta();
    SY.cfg=null; SY.key=null; SY.lastOk=0; SY.lastErr=""; SY.dirty=false; SY.warned=false;
    var m = await dbGet("prefs","syncmeta");
    if(m && m.enc){ try{ syncMeta = normalizeSyncMeta(await decJSON(sessionKey, m.enc)); }catch(e){} }
    var c = await dbGet("prefs","sync");
    if(c && c.enc){
      try{
        var cfg = await decJSON(sessionKey, c.enc);
        if(cfg && cfg.owner && cfg.repo && cfg.token && cfg.keyB64 && cfg.wrap){
          SY.cfg = cfg;
          SY.key = await subtle.importKey("raw", fromB64(cfg.keyB64), "AES-GCM", false, ["encrypt","decrypt"]);
        }
      }catch(e){}
    }
  }
  function markDirty(){
    SY.dirty = true;
    if(!SY.cfg || !sessionKey) return;
    if(SY.timer) clearTimeout(SY.timer);
    SY.timer = setTimeout(function(){ SY.timer=null; syncNow("auto"); }, SYNC_DEBOUNCE_MS);
  }

  // --- GitHub-Contents-API (api.github.com erlaubt CORS) ---
  function ghHeaders(token){
    return { "Authorization":"Bearer "+token, "Accept":"application/vnd.github+json",
             "X-GitHub-Api-Version":"2022-11-28" };
  }
  function ghBase(cfg){
    return "https://api.github.com/repos/"+encodeURIComponent(cfg.owner)+"/"+encodeURIComponent(cfg.repo);
  }
  async function ghGetRepo(cfg){
    var r = await fetch(ghBase(cfg), { headers: ghHeaders(cfg.token) });
    return { status:r.status, json: r.ok ? await r.json() : null };
  }
  async function ghGetFile(cfg){
    var r = await fetch(ghBase(cfg)+"/contents/"+SYNC_FILE, { headers: ghHeaders(cfg.token), cache:"no-store" });
    if(r.status===404) return { status:404 };
    if(!r.ok) return { status:r.status };
    var j = await r.json();
    var b64c = j.content;
    if((!b64c || !String(b64c).trim()) && j.git_url){   // >1 MB liefert die Contents-API leer -> Blob-API
      var rb = await fetch(j.git_url, { headers: ghHeaders(cfg.token), cache:"no-store" });
      if(!rb.ok) return { status:rb.status };
      b64c = (await rb.json()).content;
    }
    var file = null;
    try{ file = JSON.parse(new TextDecoder().decode(fromB64(String(b64c||"").replace(/\s+/g,"")))); }catch(e){}
    return { status:200, sha:j.sha, file:file };
  }
  async function ghPutFile(cfg, fileObj, sha){
    var body = { message:"Tagebuch-Sync "+new Date().toISOString(),
                 content: b64(new TextEncoder().encode(JSON.stringify(fileObj))) };
    if(sha) body.sha = sha;
    var r = await fetch(ghBase(cfg)+"/contents/"+SYNC_FILE,
      { method:"PUT", headers: ghHeaders(cfg.token), body: JSON.stringify(body) });
    if(!r.ok) return { status:r.status };
    var j = await r.json();
    return { status:200, sha: j.content && j.content.sha };
  }
  function syncErrText(status){
    if(status===401) return 'Token ungültig oder abgelaufen – unter „Online-Speicher" erneuern.';
    if(status===403) return "Zugriff verweigert – Token-Berechtigung prüfen (Contents: Read and write).";
    if(status===404) return "Repository nicht gefunden – Name und Token-Zugriff prüfen.";
    return "GitHub meldet Fehler "+status+".";
  }

  // --- Zusammenführen (pro Eintrag/Tag gewinnt die jüngste Änderung) ---
  function entryMod(e){ return +e.mod || +e.ts || 0; }
  function validRemoteEntry(e){
    return e && (typeof e.id==="string" || typeof e.id==="number") && String(e.id)!=="" &&
           typeof e.text==="string" &&
           typeof e.date==="string" && /^\d{4}-\d{2}-\d{2}$/.test(e.date);
  }
  function sameCounts(a,b){
    for(var i=0;i<MARKERS.length;i++){ var L=MARKERS[i]; if(((a&&a[L])||0)!==((b&&b[L])||0)) return false; }
    return true;
  }
  function maxCounts(a,b){
    var out={};
    MARKERS.forEach(function(L){ var n=Math.max((a&&a[L])||0,(b&&b[L])||0); if(n>0) out[L]=n; });
    return Object.keys(out).length ? out : undefined;
  }
  function mergeKeyedMaps(Lmap, Lts, Rmap, Rts, eq, pickTie){
    var out = { changed:false, push:false, metaChanged:false };
    Rmap = (Rmap && typeof Rmap==="object") ? Rmap : {};
    Rts  = (Rts  && typeof Rts ==="object") ? Rts  : {};
    var keys={};
    [Lmap,Lts,Rmap,Rts].forEach(function(m){
      Object.keys(m).forEach(function(k){ if(/^\d{4}-\d{2}-\d{2}$/.test(k)) keys[k]=true; });
    });
    Object.keys(keys).forEach(function(k){
      var lt=+Lts[k]||0, rt=+Rts[k]||0, lv=Lmap[k], rv=Rmap[k];
      if(rt>lt){
        if(!eq(lv,rv)){ if(rv===undefined) delete Lmap[k]; else Lmap[k]=rv; out.changed=true; }
        Lts[k]=rt; out.metaChanged=true;
      } else if(lt>rt){
        out.push=true;
      } else {                       // gleich alt (auch 0/0 aus der Zeit vor dem Sync): großzügig vereinen
        var mv=pickTie(lv,rv);
        if(!eq(mv,lv)){ if(mv===undefined) delete Lmap[k]; else Lmap[k]=mv; out.changed=true; }
        if(!eq(mv,rv)) out.push=true;
      }
    });
    return out;
  }
  async function mergeRemotePayload(P){
    var res = { localChanged:false, pushNeeded:false };
    var metaChanged = false;
    P = (P && typeof P==="object") ? P : {};
    var Rtomb={}; if(P.tomb && typeof P.tomb==="object"){
      Object.keys(P.tomb).forEach(function(id){ var t=+P.tomb[id]; if(t>0) Rtomb[id]=t; });
    }
    var Rents={}; (Array.isArray(P.entries)?P.entries:[]).forEach(function(e){ if(validRemoteEntry(e)) Rents[e.id]=e; });
    var Ltomb = syncMeta.tomb;
    var byId={}; entries.forEach(function(e){ byId[e.id]=e; });

    // Remote-Löschungen übernehmen – außer der lokale Eintrag wurde danach bearbeitet
    for(var id in Rtomb){
      var rt=Rtomb[id], le=byId[id];
      if(le && entryMod(le)>rt){ res.pushNeeded=true; continue; }
      if(le){
        delete byId[id];
        entries = entries.filter(function(e){ return e.id!==id; });
        await dbDelete("entries", id);
        res.localChanged=true;
      }
      if(!(Ltomb[id]>=rt)){ Ltomb[id]=rt; metaChanged=true; }
    }
    // Lokale Löschungen: Remote kennt sie noch nicht – oder hat den Eintrag danach bearbeitet
    for(var id2 in Ltomb){
      var lt=Ltomb[id2], re=Rents[id2];
      if(re && entryMod(re)>lt){ delete Ltomb[id2]; metaChanged=true; }   // Bearbeitung schlägt ältere Löschung
      else if(re || !(Rtomb[id2]>=lt)) res.pushNeeded=true;
    }
    // Remote-Einträge übernehmen bzw. abgleichen
    for(var id3 in Rents){
      var reE=Rents[id3];
      if(Ltomb[id3]>=entryMod(reE)) continue;
      var leE=byId[id3];
      if(!leE){
        var rec={ id:String(reE.id), date:reE.date, ts:+reE.ts||entryMod(reE)||Date.now(),
                  mod:entryMod(reE), text:String(reE.text),
                  cat:(typeof reE.cat==="string"&&reE.cat) ? reE.cat : FALLBACK.key };
        entries.push(rec); byId[rec.id]=rec;
        await putEntry(rec);
        res.localChanged=true;
      } else {
        var lm=entryMod(leE), rm=entryMod(reE);
        if(rm>lm){
          leE.date=reE.date; leE.ts=+reE.ts||leE.ts; leE.text=String(reE.text);
          leE.cat=(typeof reE.cat==="string"&&reE.cat)?reE.cat:leE.cat; leE.mod=rm;
          await putEntry(leE);
          res.localChanged=true;
        } else if(lm>rm) res.pushNeeded=true;
      }
    }
    // Nur lokal vorhandene Einträge -> hochladen
    for(var i=0;i<entries.length;i++){ if(!Rents[entries[i].id]){ res.pushNeeded=true; break; } }

    var r1 = mergeKeyedMaps(markers, syncMeta.marksTs, normalizeMarkers(P.markers), P.marksTs, sameCounts, maxCounts);
    if(r1.changed){ await saveMarkersEnc(); res.localChanged=true; }
    var r2 = mergeKeyedMaps(moods, syncMeta.moodsTs, normalizeMoods(P.moods), P.moodsTs,
      function(a,b){ return (+a||0)===(+b||0); },
      function(a,b){ var v=Math.max(+a||0,+b||0); return v>0?v:undefined; });
    if(r2.changed){ await saveMoodsEnc(); res.localChanged=true; }
    if(r1.push||r2.push) res.pushNeeded=true;
    if(r1.metaChanged||r2.metaChanged) metaChanged=true;

    // Kategorien: die zuletzt geänderte Liste gewinnt als Ganzes
    var rCats = Array.isArray(P.categories) ? P.categories.filter(function(c){
      return c && typeof c.key==="string" && typeof c.label==="string" &&
             typeof c.color==="string" && /^#[0-9a-fA-F]{3,8}$/.test(c.color);
    }) : [];
    var rMod = +P.catsMod||0;
    if(rCats.length && rMod>syncMeta.catsMod){
      S.cats = rCats; syncMeta.catsMod = rMod; metaChanged=true;
      await saveCatsEnc(); res.localChanged=true;
      if(S.filter!=="all" && !S.cats.some(function(c){ return c.key===S.filter; })) S.filter="all";
      if(!S.cats.some(function(c){ return c.key===S.draftCat; })) S.draftCat = S.cats[0] ? S.cats[0].key : "privat";
    } else if(syncMeta.catsMod>rMod || JSON.stringify(rCats)!==JSON.stringify(S.cats)){
      res.pushNeeded=true;
    }

    if(metaChanged) await saveSyncMetaEnc();
    return res;
  }
  function buildSyncPayload(){
    return { v:1,
      catsMod:syncMeta.catsMod, categories:S.cats,
      markers:markers, marksTs:syncMeta.marksTs,
      moods:moods, moodsTs:syncMeta.moodsTs,
      tomb:syncMeta.tomb,
      entries: entries.map(function(e){ return { id:e.id, date:e.date, ts:e.ts, mod:entryMod(e), text:e.text, cat:e.cat }; })
    };
  }

  async function syncNow(reason){
    if(!SY.cfg || !SY.key || !sessionKey) return false;
    if(SY.busy){ SY.again=true; return false; }
    SY.busy=true;
    if(S.view==="sync" && !S.gate) render();
    var ok=false;
    try{
      var cfg=SY.cfg;
      var got = await ghGetFile(cfg);
      if(!sessionKey) throw { msg:"Gesperrt." };
      var remoteSha=null, pushNeeded=false;
      if(got.status===200){
        remoteSha=got.sha;
        var f=got.file;
        if(!f || f.app!=="tagebuch-sync" || !f.payload) throw { msg:"Unerwartetes Dateiformat im Online-Speicher." };
        var P;
        try{ P = await decJSON(SY.key, f.payload); }
        catch(e){ throw { msg:"Entschlüsselung fehlgeschlagen – Online-Speicher bitte trennen und neu verbinden." }; }
        // Passwort-Wechsel eines anderen Geräts übernehmen (neue Schlüssel-Verpackung)
        if(!cfg.rewrapPending && f.kdf && f.wrappedKey){
          cfg.wrap = { salt:f.kdf.salt, iterations:f.kdf.iterations, wrappedKey:f.wrappedKey };
        }
        var m = await mergeRemotePayload(P);
        if(m.localChanged && !S.gate) render();
        pushNeeded = m.pushNeeded;
      } else if(got.status===404){
        pushNeeded=true;
      } else throw { msg:syncErrText(got.status) };

      if(pushNeeded || SY.dirty || cfg.rewrapPending){
        SY.dirty=false;               // Änderungen während des Hochladens setzen das Flag erneut
        if(!sessionKey) throw { msg:"Gesperrt." };
        var fileObj = { app:"tagebuch-sync", version:1, updatedAt:new Date().toISOString(),
          kdf:{ salt:cfg.wrap.salt, iterations:cfg.wrap.iterations },
          wrappedKey: cfg.wrap.wrappedKey,
          payload: await encJSON(SY.key, buildSyncPayload()) };
        var put = await ghPutFile(cfg, fileObj, remoteSha);
        if(put.status===409 || put.status===422){
          // Ein anderes Gerät hat inzwischen gespeichert: neu laden, mergen, einmal erneut versuchen
          var again = await ghGetFile(cfg);
          if(again.status===200 && again.file && again.file.payload){
            var P2=null; try{ P2 = await decJSON(SY.key, again.file.payload); }catch(e){}
            if(P2){ var m2 = await mergeRemotePayload(P2); if(m2.localChanged && !S.gate) render(); }
            fileObj.payload = await encJSON(SY.key, buildSyncPayload());
            fileObj.updatedAt = new Date().toISOString();
            put = await ghPutFile(cfg, fileObj, again.sha);
          }
        }
        if(put.status!==200){
          throw { msg:(put.status===409||put.status===422) ? "Gleichzeitige Änderung – bitte gleich erneut synchronisieren." : syncErrText(put.status) };
        }
        cfg.sha=put.sha; cfg.rewrapPending=false;
      } else if(remoteSha) cfg.sha=remoteSha;

      await saveSyncCfgEnc();
      SY.lastOk=Date.now(); SY.lastErr=""; SY.warned=false; ok=true;
    } catch(err){
      SY.lastErr = (err && err.msg) ? err.msg : "Offline oder Netzwerkfehler – wird nachgeholt.";
      if(!(err && err.msg)) console.warn("Sync:", err);
      if(reason!=="manual" && !SY.warned && sessionKey){
        SY.warned=true;
        flash('Sync fehlgeschlagen – Details unter „Online-Speicher"');
      }
    } finally {
      SY.busy=false;
      if(SY.again){ SY.again=false; setTimeout(function(){ syncNow(reason); }, 0); }
      else if(S.view==="sync" && !S.gate) render();
    }
    return ok;
  }

  // --- Einrichten / Trennen ---
  function parseRepoInput(s){
    s = String(s||"").trim()
      .replace(/^https?:\/\/(www\.)?github\.com\//i,"")
      .replace(/\.git$/i,"").replace(/\/+$/,"");
    var m = s.split("/");
    if(m.length!==2 || !m[0] || !m[1]) return null;
    return { owner:m[0], repo:m[1] };
  }
  async function setupSync(repoStr, token, password){
    var pr = parseRepoInput(repoStr);
    if(!pr) return 'Repository bitte als „benutzername/repo" angeben.';
    token = String(token||"").trim();
    if(!token) return "Bitte einen GitHub-Token eingeben.";
    if(!password) return "Bitte dein Tagebuch-Passwort eingeben.";
    var cfg = { owner:pr.owner, repo:pr.repo, token:token, keyB64:null, wrap:null, sha:null, rewrapPending:false };
    var repo;
    try{ repo = await ghGetRepo(cfg); }
    catch(e){ return "Keine Verbindung zu GitHub – bist du online?"; }
    if(repo.status===401) return "Token ungültig.";
    if(repo.status===404) return "Repository nicht gefunden – Name und Token-Zugriff prüfen.";
    if(repo.status!==200) return syncErrText(repo.status);
    if(repo.json && repo.json.private===false) return "Bitte ein privates Repository verwenden – dein Tagebuch gehört nicht in ein öffentliches.";
    var got;
    try{ got = await ghGetFile(cfg); }
    catch(e){ return "Keine Verbindung zu GitHub – bist du online?"; }
    if(got.status===200){
      var f=got.file;
      if(!f || f.app!=="tagebuch-sync" || !f.kdf || !f.wrappedKey || !f.payload){
        return 'Im Repository liegt bereits eine „'+SYNC_FILE+'" in unerwartetem Format.';
      }
      try{
        var kk = await deriveKey(password, fromB64(f.kdf.salt), f.kdf.iterations||PBKDF2_ITER);
        cfg.keyB64 = await decJSON(kk, f.wrappedKey);
        if(typeof cfg.keyB64!=="string" || !cfg.keyB64) throw 0;
      }catch(e){
        return "Passwort passt nicht zum Online-Speicher. Falls das andere Gerät ein anderes Tagebuch-Passwort nutzt, gib jenes ein.";
      }
      cfg.wrap = { salt:f.kdf.salt, iterations:f.kdf.iterations||PBKDF2_ITER, wrappedKey:f.wrappedKey };
    } else if(got.status===404){
      // Neu anlegen: Zur Sicherheit muss es das Passwort dieses Tagebuchs sein
      var a = await dbGet("prefs","auth");
      try{
        var lk = await deriveKey(password, fromB64(a.salt), a.iterations||PBKDF2_ITER);
        if((await decJSON(lk, a.verifier))!==VERIFY_TOKEN) throw 0;
      }catch(e){ return "Das ist nicht dein Tagebuch-Passwort."; }
      cfg.keyB64 = b64(rndBytes(32));
      var salt = rndBytes(16);
      var wk = await deriveKey(password, salt, PBKDF2_ITER);
      cfg.wrap = { salt:b64(salt), iterations:PBKDF2_ITER, wrappedKey: await encJSON(wk, cfg.keyB64) };
    } else return syncErrText(got.status);
    SY.cfg = cfg;
    SY.key = await subtle.importKey("raw", fromB64(cfg.keyB64), "AES-GCM", false, ["encrypt","decrypt"]);
    if(!syncMeta.catsMod){ syncMeta.catsMod = Date.now(); await saveSyncMetaEnc(); }
    SY.dirty = true;
    await saveSyncCfgEnc();
    var ok = await syncNow("manual");
    return ok ? null : (SY.lastErr || "Synchronisierung fehlgeschlagen.");
  }
  async function detachSync(){
    if(SY.timer){ clearTimeout(SY.timer); SY.timer=null; }
    SY.cfg=null; SY.key=null; SY.lastOk=0; SY.lastErr=""; SY.dirty=false; SY.warned=false;
    await saveSyncCfgEnc();
  }

  // ---------- Auth ----------
  async function hasAuth(){ var a = await dbGet("prefs","auth"); return !!(a && a.salt && a.verifier); }
  async function setupPassword(password){
    var salt = rndBytes(16);
    var key = await deriveKey(password, salt, PBKDF2_ITER);
    var verifier = await encJSON(key, VERIFY_TOKEN);
    sessionKey = key;
    await dbPut("prefs", { key:"auth", salt:b64(salt), iterations:PBKDF2_ITER, verifier:verifier });
    // Bestehende Klartext-Daten (aus früheren Versionen) migrieren
    var raw = await dbGetAll("entries") || [];
    for(var i=0;i<raw.length;i++){ var r=raw[i]; if(r && !r.enc && r.text){ await putEntry(r); } }
    var oldCats = await dbGet("prefs","cats");
    if(oldCats && Array.isArray(oldCats.value) && oldCats.value.length){ S.cats = oldCats.value; }
    S.draftCat = S.cats[0] ? S.cats[0].key : "privat";
    await saveCatsEnc();
    entries = await loadAllEntries();
    markers = {};
    moods = {};
    syncMeta = freshSyncMeta();
  }
  async function unlock(password){
    var a = await dbGet("prefs","auth");
    if(!a) return false;
    var key = await deriveKey(password, fromB64(a.salt), a.iterations || PBKDF2_ITER);
    try{ var v = await decJSON(key, a.verifier); if(v !== VERIFY_TOKEN) return false; }
    catch(e){ return false; }
    sessionKey = key;
    var c = await dbGet("prefs","cats");
    if(c && c.enc){ try{ var arr = await decJSON(sessionKey, c.enc); if(Array.isArray(arr) && arr.length) S.cats = arr; }catch(e){} }
    else if(c && Array.isArray(c.value) && c.value.length){ S.cats = c.value; await saveCatsEnc(); }
    S.draftCat = S.cats[0] ? S.cats[0].key : "privat";
    entries = await loadAllEntries();
    markers = {};
    var mk = await dbGet("prefs","markers");
    if(mk && mk.enc){ try{ markers = normalizeMarkers(await decJSON(sessionKey, mk.enc)); }catch(e){ markers = {}; } }
    moods = {};
    var md = await dbGet("prefs","moods");
    if(md && md.enc){ try{ moods = normalizeMoods(await decJSON(sessionKey, md.enc)); }catch(e){ moods = {}; } }
    await loadSyncState();
    return true;
  }
  async function changePassword(oldPw, newPw){
    var a = await dbGet("prefs","auth");
    if(!a) return false;
    var oldKey = await deriveKey(oldPw, fromB64(a.salt), a.iterations || PBKDF2_ITER);
    try{ var v = await decJSON(oldKey, a.verifier); if(v !== VERIFY_TOKEN) return false; }
    catch(e){ return false; }
    var salt = rndBytes(16);
    var newKey = await deriveKey(newPw, salt, PBKDF2_ITER);
    sessionKey = newKey;                       // ab jetzt mit neuem Schlüssel schreiben
    for(var i=0;i<entries.length;i++){ await putEntry(entries[i]); }
    await saveCatsEnc();
    await saveMarkersEnc();
    await saveMoodsEnc();
    await saveSyncMetaEnc();
    if(SY.cfg){
      // Sync-Schlüssel mit dem neuen Passwort neu verpacken; nächster Sync lädt es hoch
      var sSalt = rndBytes(16);
      var wKey = await deriveKey(newPw, sSalt, PBKDF2_ITER);
      SY.cfg.wrap = { salt:b64(sSalt), iterations:PBKDF2_ITER, wrappedKey: await encJSON(wKey, SY.cfg.keyB64) };
      SY.cfg.rewrapPending = true;
      markDirty();
    }
    await saveSyncCfgEnc();
    await dbPut("prefs", { key:"auth", salt:b64(salt), iterations:PBKDF2_ITER, verifier: await encJSON(newKey, VERIFY_TOKEN) });
    return true;
  }

  function normalizeMarkers(obj){    // akzeptiert altes Array-Format und neues Zähl-Objekt

    Object.keys(obj||{}).forEach(function(k){

      if(Array.isArray(v)){ v.forEach(function(L){ if(MARKERS.indexOf(L)>=0) c[L]=(c[L]||0)+1; }); }
      else if(v && typeof v==="object"){ MARKERS.forEach(function(L){ var n=parseInt(v[L],10); if(n>0) c[L]=n; }); }
      if(Object.keys(c).length) out[k]=c;

  // ---------- Schreibserie / „An diesem Tag" ----------
  function computeCurrentStreak(){
    var set={}; entries.forEach(function(e){ set[e.date]=true; });
    var d=new Date();
    if(!set[keyOf(d)]) d=addDays(d,-1);   // heute noch leer? Serie ab gestern zählen
    var n=0;
    while(set[keyOf(d)]){ n++; d=addDays(d,-1); }
    return n;
  }
  function onThisDayItems(dk){
    if(!entries.length) return [];
    var d=parseKey(dk), out=[];
    var minYear=99999;
    entries.forEach(function(e){ var y=parseInt(e.date.slice(0,4),10); if(y<minYear) minYear=y; });
    function sameDay(y,m){   // Datums-Überlauf abfangen (29. Feb, 31. in kurzem Monat)
      var t=new Date(y,m,d.getDate());
      if(t.getDate()!==d.getDate()){
        if(m===1 && d.getDate()===29) return new Date(y,1,28);
        return null;
      }
      return t;
    }
    function pushIf(t,label){
      if(!t) return;
      var k=keyOf(t);
      if(k>=dk) return;
      var list=entriesFor(k);
      if(list.length) out.push({ label:label, key:k, list:list });
    }
    for(var y=d.getFullYear()-1; y>=minYear && out.length<5; y--){
      var back=d.getFullYear()-y;
      pushIf(sameDay(y,d.getMonth()), back===1 ? "Vor 1 Jahr" : "Vor "+back+" Jahren");
    }
    var monthsBack=[1,3,6];
    for(var i=0;i<monthsBack.length && out.length<5;i++){
      var mb=monthsBack[i], ym=d.getFullYear(), mm=d.getMonth()-mb;
      while(mm<0){ mm+=12; ym--; }
      pushIf(sameDay(ym,mm), mb===1 ? "Vor 1 Monat" : "Vor "+mb+" Monaten");
    }
    out.sort(function(a,b){ return a.key<b.key ? 1 : -1; });
    return out;
  }

  // ---------- Statistik ----------
  function computeStats(year, month){
    var list = entries.filter(function(e){ var d=parseKey(e.date); return d.getFullYear()===year && d.getMonth()===month; });
    var daysInMonth = new Date(year, month+1, 0).getDate();
    var perCat = {};
    var perDay = new Array(daysInMonth).fill(0);
    var perWeekday = [0,0,0,0,0,0,0];
    var daySet = {};
    list.forEach(function(e){
      var d = parseKey(e.date);
      perDay[d.getDate()-1]++;
      perWeekday[(d.getDay()+6)%7]++;
      daySet[d.getDate()] = true;
      perCat[e.cat] = (perCat[e.cat]||0)+1;
    });
    var daysWith = Object.keys(daySet).length;
    var nums = Object.keys(daySet).map(Number).sort(function(a,b){ return a-b; });
    var longest=0, cur=0, prev=null;
    nums.forEach(function(n){ if(prev!==null && n===prev+1) cur++; else cur=1; if(cur>longest) longest=cur; prev=n; });
    var catStats = S.cats.map(function(c){ return { label:c.label, color:c.color, count:perCat[c.key]||0 }; });
    var fbCount = perCat[FALLBACK.key]||0;
    // Einträge mit gelöschten Kategorien
    var known = {}; S.cats.forEach(function(c){ known[c.key]=true; });
    Object.keys(perCat).forEach(function(k){ if(!known[k]) fbCount += (k===FALLBACK.key?0:perCat[k]); });
    if(fbCount>0) catStats.push({ label:FALLBACK.label, color:FALLBACK.color, count:fbCount });
    catStats = catStats.filter(function(c){ return c.count>0; }).sort(function(a,b){ return b.count-a.count; });
    var maxCat = catStats.reduce(function(m,c){ return Math.max(m,c.count); }, 0);
    var maxWd = Math.max.apply(null, perWeekday);
    var busiestWd = maxWd>0 ? WD_LONG[perWeekday.indexOf(maxWd)] : "—";
    var maxDay = Math.max.apply(null, perDay.concat([0]));
    return { total:list.length, daysInMonth:daysInMonth, daysWith:daysWith, longest:longest,
             catStats:catStats, maxCat:maxCat, perDay:perDay, maxDay:maxDay, busiestWd:busiestWd, maxWd:maxWd };
  }

  function moodTrendHTML(y,m){
    var daysInMonth = new Date(y,m+1,0).getDate();
    var pts=[], sum=0;
    for(var day=1; day<=daysInMonth; day++){
      var v = moods[y+"-"+pad(m+1)+"-"+pad(day)];
      if(v){ pts.push({d:day, v:v}); sum+=v; }
    }
    var title = '<div class="stat-section-title">Stimmungsverlauf'+
      (pts.length ? ' · Ø '+MOOD_EMOJI[Math.round(sum/pts.length)-1] : '')+'</div>';
    if(!pts.length) return title+'<p class="note" style="margin-top:0">Noch keine Stimmung erfasst.</p>';
    var W=310, H=80, padX=8, padY=10;
    function X(day){ return (padX + (daysInMonth>1 ? (day-1)/(daysInMonth-1)*(W-2*padX) : 0)).toFixed(1); }
    function Y(v){ return (H-padY - (v-1)/4*(H-2*padY)).toFixed(1); }
    var segs=[], seg=[];
    pts.forEach(function(p){
      if(seg.length && p.d !== seg[seg.length-1].d+1){ segs.push(seg); seg=[]; }
      seg.push(p);
    });
    if(seg.length) segs.push(seg);
    var svg = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" role="img" aria-label="Stimmungsverlauf">';
    segs.forEach(function(sg){
      if(sg.length>1){
        var pl = sg.map(function(p){ return X(p.d)+","+Y(p.v); }).join(" ");
        svg += '<polyline points="'+pl+'" fill="none" stroke="var(--ring)" stroke-width="1.5"/>';
      }
    });
    pts.forEach(function(p){
      svg += '<circle cx="'+X(p.d)+'" cy="'+Y(p.v)+'" r="3.2" fill="'+MOOD_COLORS[p.v-1]+'"/>';
    });
    svg += '</svg>';
    return title+'<div class="moodline">'+svg+'</div>';
  }

  function yearHeatHTML(y){
    var byMood = S.heatMetric==="mood";
    var counts={}, total=0, ys=String(y);
    entries.forEach(function(e){ if(e.date.slice(0,4)===ys){ counts[e.date]=(counts[e.date]||0)+1; total++; } });
    var moodCnt=0; Object.keys(moods).forEach(function(k){ if(k.slice(0,4)===ys) moodCnt++; });
    var tk = keyOf(new Date());
    var rows="";
    for(var m=0;m<12;m++){
      var dim = new Date(y,m+1,0).getDate();
      var cells="";
      for(var day=1;day<=31;day++){
        if(day>dim){ cells+="<span></span>"; continue; }
        var k = y+"-"+pad(m+1)+"-"+pad(day);
        var cls="hm-cell", style="";
        if(byMood){
          if(moods[k]) style="background:"+MOOD_COLORS[moods[k]-1]; else cls+=" e0";
        } else {
          var c = counts[k]||0;
          if(c===0) cls+=" e0";
          else style="background:"+(c===1?"#24201955":(c<=3?"#242019AA":"var(--ink)"));
        }
        if(k===tk) cls+=" today";
        cells += '<button class="'+cls+'" data-day="'+k+'" style="'+style+'" aria-label="'+day+'. '+MONTHS[m]+' '+y+'"></button>';
      }
      rows += '<div class="hm-row"><span class="hm-lab">'+MONTHS_SHORT[m]+'</span>'+cells+'</div>';
    }
    var legend = byMood
      ? '<div class="hm-legend">'+MOOD_EMOJI.map(function(em,i){
          return '<span class="sq" style="background:'+MOOD_COLORS[i]+'" title="'+em+'"></span>';
        }).join("")+'</div>'
      : '<div class="hm-legend">weniger '+
        '<span class="sq" style="background:var(--paper); box-shadow:inset 0 0 0 1px var(--line)"></span>'+
        '<span class="sq" style="background:#24201955"></span>'+
        '<span class="sq" style="background:#242019AA"></span>'+
        '<span class="sq" style="background:var(--ink)"></span> mehr</div>';
    var daysWith = Object.keys(counts).length;
    var tiles = '<div class="stat-grid">'+
      '<div class="stat-tile"><div class="stat-num">'+total+'</div><div class="stat-label">'+(total===1?"Eintrag":"Einträge")+'</div></div>'+
      '<div class="stat-tile"><div class="stat-num">'+daysWith+'</div><div class="stat-label">'+(daysWith===1?"Tag":"Tage")+' mit Eintrag</div></div>'+
    '</div>';
    var metricSeg = '<div class="controls" style="justify-content:center; margin:12px 0 10px">'+
      '<div class="seg" role="tablist" aria-label="Messwert">'+
        '<button class="'+(!byMood?"on":"")+'" data-act="heat-entries">Einträge</button>'+
        '<button class="'+(byMood?"on":"")+'" data-act="heat-mood">Stimmung</button>'+
      '</div></div>';
    var note = (byMood ? moodCnt===0 : total===0)
      ? '<p class="note">'+(byMood?"Keine Stimmungen in diesem Jahr.":"Keine Einträge in diesem Jahr.")+'</p>' : '';
    return tiles+metricSeg+'<div class="hm">'+rows+legend+'</div>'+note;
  }

  function fmtAgo(ts){
    if(!ts) return "noch nie";
    var s = Math.round((Date.now()-ts)/1000);
    if(s<10) return "gerade eben";
    if(s<60) return "vor "+s+" Sekunden";
    var m = Math.round(s/60);
    if(m<60) return "vor "+m+" Min.";
    return "am "+new Intl.DateTimeFormat("de-DE",{ dateStyle:"short", timeStyle:"short" }).format(new Date(ts));
  }

                '<button class="mini-btn" data-act="sync-detach-no" style="color:var(--inkSoft); padding:10px 16px">Abbrechen</button></div>'
            : '<button class="ghost" data-act="sync-detach-ask" style="color:#C0504D">Verbindung trennen</button>')+
        '</div>'+
        '<p class="note">Synchronisiert wird automatisch beim Entsperren und nach Änderungen. Gelöschte Einträge verschwinden auf allen Geräten; ändern zwei Geräte dasselbe, gewinnt die jüngste Version. Im Repository liegt nur die verschlüsselte Datei „'+SYNC_FILE+'" – beim Trennen bleibt sie dort erhalten, dieses Gerät synchronisiert nur nicht mehr.</p>';
    }
    return headerHTML()+
    '<main>'+
      '<div class="sub-head">'+
        '<button class="iconbtn sm" data-act="to-calendar" aria-label="Zurück" style="margin-left:-6px">'+icon("ArrowLeft",22)+'</button>'+
        '<h2 class="sub-title">Online-Speicher</h2>'+
      '</div>'+
      '<div class="scroll">'+inner+'</div>'+
    '</main>';
  }

  // ---------- Menü ----------
  function menuHTML(){
    if(!S.menuOpen) return "";
    return '<div class="backdrop" data-act="close-menu">'+
      '<div class="sheet" id="sheet">'+
        '<div class="grip"></div>'+
        '<button class="menu-item" data-act="open-stats"><span style="color:var(--inkSoft)">'+icon("BarChart",19)+'</span><span>Monats-Statistik</span></button>'+
        '<div class="menu-sep"></div>'+
        '<button class="menu-item" data-act="open-cats"><span style="color:var(--inkSoft)">'+icon("Tag",19)+'</span><span>Kategorien verwalten</span></button>'+
        '<div class="menu-sep"></div>'+
        '<button class="menu-item" data-act="export"><span style="color:var(--inkSoft)">'+icon("Download",19)+'</span><span>Als Datei sichern (JSON)</span></button>'+
        '<div class="menu-sep"></div>'+
        '<button class="menu-item" data-act="import"><span style="color:var(--inkSoft)">'+icon("Upload",19)+'</span><span>Aus Datei importieren</span></button>'+
        '<div class="menu-sep"></div>'+
        '<button class="menu-item" data-act="open-sync"><span style="color:var(--inkSoft)">'+icon("Cloud",19)+'</span><span>Online-Speicher'+(SY.cfg?'':' einrichten')+'</span></button>'+
        '<div class="menu-sep"></div>'+
        '<button class="menu-item" data-act="change-pw"><span style="color:var(--inkSoft)">'+icon("KeyRound",19)+'</span><span>Passwort ändern</span></button>'+
        '<div class="menu-sep"></div>'+
        '<button class="menu-item" data-act="lock"><span style="color:var(--inkSoft)">'+icon("Lock",19)+'</span><span>Sperren</span></button>'+
        '<p class="note" style="margin-top:12px">'+(SY.cfg
          ? 'Deine Einträge sind mit deinem Passwort verschlüsselt und werden – ebenfalls nur verschlüsselt – in deinem Online-Speicher synchronisiert. Die JSON-Sicherung bleibt trotzdem ein gutes Backup.'
          : 'Deine Einträge sind mit deinem Passwort verschlüsselt und liegen nur auf diesem Gerät. Sichere sie regelmäßig als Datei – oder richte den Online-Speicher ein, um mehrere Geräte synchron zu halten.')+'</p>'+
      '</div>'+
    '</div>';
  }

  // ---------- Login / Gate ----------
  function gateHTML(){
    var brand = '<div class="gate-brand"><span style="color:var(--inkSoft)">'+icon("CalendarDays",22)+'</span><span class="b">Tagebuch</span></div>';
    var err = '<p class="err">'+esc(S.gateErr)+'</p>';
    if(S.gate==="setup"){
      return '<div class="shell"><main class="gate">'+brand+
        '<div class="lock-icon">'+icon("LockBig",30)+'</div>'+
        '<h1>Passwort einrichten</h1>'+
        '<p class="lead">Wähle ein Passwort. Deine Einträge werden damit verschlüsselt – niemand kann sie ohne dieses Passwort lesen.</p>'+
        '<div class="field"><label for="pw1">Passwort (mind. 6 Zeichen)</label><input id="pw1" type="password" autocomplete="new-password" inputmode="text" /></div>'+
        '<div class="field"><label for="pw2">Passwort wiederholen</label><input id="pw2" type="password" autocomplete="new-password" /></div>'+
        err+
        '<button class="primary" id="gateSetup"'+(S.gateBusy?" disabled":"")+'>'+(S.gateBusy?"Wird eingerichtet…":"Einrichten")+'</button>'+
        '<div class="warn"><b>Wichtig:</b> Es gibt keinen Passwort-Reset. Vergisst du das Passwort, sind die Einträge unwiederbringlich verloren. Sichere regelmäßig über „Als Datei sichern".</div>'+
      '</main></div>';
    }
    if(S.gate==="change"){
      return '<div class="shell"><main class="gate">'+brand+
        '<div class="lock-icon">'+icon("KeyRound",28)+'</div>'+
        '<h1>Passwort ändern</h1>'+
        '<p class="lead">Alle Einträge werden mit dem neuen Passwort neu verschlüsselt.</p>'+
        '<div class="field"><label for="pwo">Aktuelles Passwort</label><input id="pwo" type="password" autocomplete="current-password" /></div>'+
        '<div class="field"><label for="pw1">Neues Passwort (mind. 6 Zeichen)</label><input id="pw1" type="password" autocomplete="new-password" /></div>'+
        '<div class="field"><label for="pw2">Neues Passwort wiederholen</label><input id="pw2" type="password" autocomplete="new-password" /></div>'+
        err+
        '<button class="primary" id="gateChange"'+(S.gateBusy?" disabled":"")+'>'+(S.gateBusy?"Wird geändert…":"Ändern")+'</button>'+
        '<button class="ghost" data-act="gate-cancel">Abbrechen</button>'+
      '</main></div>';
    }
    // login
    return '<div class="shell"><main class="gate">'+brand+
      '<div class="lock-icon">'+icon("LockBig",30)+'</div>'+

      '<p class="lead">Gib dein Passwort ein, um dein Tagebuch zu entsperren.</p>'+
      '<div class="field"><label for="pw1">Passwort</label><input id="pw1" type="password" autocomplete="current-password" autofocus /></div>'+
      err+

    '</main></div>';
  }

  // ---------- Haupt-Render ----------
  function render(){
    if(S.gate){
      appEl.innerHTML = gateHTML();
      var f = document.getElementById(S.gate==="change" ? "pwo" : "pw1");
      if(f && !S.gateBusy) setTimeout(function(){ try{ f.focus(); }catch(_){} }, 30);
      return;
    }
    var html;
    if(S.view==="calendar") html = calendarHTML();
    else if(S.view==="day")  html = dayHTML();
    else if(S.view==="search") html = searchViewHTML();
    else if(S.view==="cats") html = catsHTML();
    else if(S.view==="stats") html = statsHTML();
    else if(S.view==="sync") html = syncHTML();
    appEl.innerHTML = '<div class="shell">'+html+menuHTML()+'</div>';

    if(S.view==="day"){
      var ta = document.getElementById("ta");
      if(ta){ ta.value = S.draftText; autoGrow(ta); if(S.editingId) ta.focus(); }
    }
    if(S.view==="search"){
      var si = document.getElementById("searchInput");
      if(si){ si.focus(); var v=si.value; si.value=""; si.value=v; }
    }
  }

  function autoGrow(el){
    if(!el) return;
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight,160)+"px";
  }

  // ---------- Aktionen ----------
  function openDay(dk){
    var d = parseKey(dk);
    S.year = d.getFullYear(); S.month = d.getMonth(); S.weekAnchor = dk;
    S.selected = dk; S.editingId = null; S.draftText = "";
    if(!S.cats.some(function(c){ return c.key===S.draftCat; })) S.draftCat = S.cats[0] ? S.cats[0].key : "privat";
    S.view = "day"; render();
  }
  function goToday(){
    var n = new Date();
    if(S.calMode==="week"){ S.weekAnchor = keyOf(n); render(); }
    else { openDay(keyOf(n)); }
  }
  function calShift(dir){
    if(S.calMode==="week"){
      S.weekAnchor = keyOf(addDays(parseKey(S.weekAnchor), dir*7)); render();
    } else {
      S.month += dir;
      if(S.month<0){ S.month=11; S.year--; }
      else if(S.month>11){ S.month=0; S.year++; }
      render();
    }
  }
  function shiftDay(dir){
    if(!S.selected) return;
    var d = addDays(parseKey(S.selected), dir);
    S.selected = keyOf(d);
    S.year = d.getFullYear(); S.month = d.getMonth(); S.weekAnchor = S.selected;
    S.editingId = null; S.draftText = "";
    render();
  }
  function openStats(){
    if(S.calMode==="week"){ var mon=mondayOf(parseKey(S.weekAnchor)); var mid=addDays(mon,3); S.statsYear=mid.getFullYear(); S.statsMonth=mid.getMonth(); }
    else { S.statsYear=S.year; S.statsMonth=S.month; }
    S.view="stats"; S.menuOpen=false; render();
  }
  function statsShift(dir){
    if(S.statsMode==="year"){ S.statsYear += dir; render(); return; }
    S.statsMonth += dir;
    if(S.statsMonth<0){ S.statsMonth=11; S.statsYear--; }
    else if(S.statsMonth>11){ S.statsMonth=0; S.statsYear++; }
    render();
  }

  async function submitEntry(){
    var text = S.draftText.trim();
    if(!text || !S.selected) return;
    if(S.editingId){
      var e = entries.find(function(x){ return x.id===S.editingId; });
      if(e){ e.text=text; e.cat=S.draftCat; e.mod=Date.now(); await putEntry(e); }
    } else {
      var rec = { id:uid(), date:S.selected, ts:Date.now(), mod:Date.now(), text:text, cat:S.draftCat };
      entries.push(rec); await putEntry(rec);
    }
    markDirty();
    S.draftText=""; S.editingId=null; render();
  }
  function startEdit(id){
    var e = entries.find(function(x){ return x.id===id; });
    if(!e) return;
    S.editingId=e.id; S.draftText=e.text; S.draftCat=e.cat; render();
  }
  function cancelEdit(){ S.editingId=null; S.draftText=""; render(); }
  async function deleteEntry(id){
    entries = entries.filter(function(e){ return e.id!==id; });
    await dbDelete("entries", id);
    syncMeta.tomb[id]=Date.now(); await saveSyncMetaEnc(); markDirty();
    if(S.editingId===id){ S.editingId=null; S.draftText=""; }
    render(); flash("Eintrag gelöscht");
  }

  function toggleRec(){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ S.micHint="Spracheingabe wird auf diesem Gerät nicht unterstützt."; render(); return; }
    if(S.rec){ if(recognition) recognition.stop(); return; }
    try{
      var r = new SR(); r.lang="de-DE"; r.interimResults=false; r.continuous=false;
      r.onresult = function(ev){
        var t = Array.prototype.map.call(ev.results, function(x){ return x[0].transcript; }).join(" ");
        S.draftText = (S.draftText ? S.draftText+" " : "") + t;
      };
      r.onerror = function(){ S.micHint="Mikrofon nicht verfügbar."; };
      r.onend = function(){ S.rec=false; render(); };
      recognition = r; r.start(); S.rec=true; S.micHint=""; render();
    } catch(err){ S.micHint="Mikrofon konnte nicht gestartet werden."; render(); }
  }

  function runSearch(q){
    S.searchQ = q;
    if(q.trim().length<2){ S.searchRes=[]; }
    else {
      var ql = q.toLowerCase();
      S.searchRes = entries.filter(function(e){ return e.text.toLowerCase().indexOf(ql)>=0; })
                           .sort(function(a,b){ return b.ts-a.ts; });
    }
    var box = document.getElementById("searchResults");
    if(box) box.innerHTML = searchResultsHTML();
    var clr = document.getElementById("searchClear");
    if(clr) clr.classList.toggle("hidden", !S.searchQ);
  }

  function exportJSON(){
    var payload = { app:"tagebuch", version:2, exportedAt:new Date().toISOString(), categories:S.cats, markers:markers, moods:moods, entries:entries.slice() };
    var blob = new Blob([JSON.stringify(payload,null,2)], { type:"application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "tagebuch-export-"+keyOf(new Date())+".json";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(a.href);
    S.menuOpen=false; render(); flash(entries.length+" Einträge exportiert");
  }
  async function importJSON(file){
    try{
      var data = JSON.parse(await file.text());
      var list = Array.isArray(data) ? data : data.entries;
      if(!Array.isArray(list)) throw new Error("Format");
      if(data.categories && data.categories.length){ S.cats = data.categories; await saveCats(S.cats); }
      var existing = {}; entries.forEach(function(e){ existing[e.id]=true; });
      var added = 0, metaTouched = false;
      for(var i=0;i<list.length;i++){
        var e = list[i];
        if(!e || !e.date || !e.text) continue;
        var rec = { id:e.id ? String(e.id) : uid(), date:e.date, ts:e.ts || Date.now(), mod:Date.now(), text:e.text, cat:e.cat || (S.cats[0] && S.cats[0].key) || "privat" };
        if(existing[rec.id]) continue;
        if(syncMeta.tomb[rec.id]!==undefined){ delete syncMeta.tomb[rec.id]; metaTouched=true; }
        existing[rec.id]=true; entries.push(rec); await putEntry(rec); added++;
      }
      if(data.markers && typeof data.markers==="object" && !Array.isArray(data.markers)){
        var norm = normalizeMarkers(data.markers);
        Object.keys(norm).forEach(function(k){ markers[k]=norm[k]; syncMeta.marksTs[k]=Date.now(); metaTouched=true; });
        await saveMarkersEnc();
      }
      if(data.moods && typeof data.moods==="object" && !Array.isArray(data.moods)){
        var nm = normalizeMoods(data.moods);
        Object.keys(nm).forEach(function(k){ moods[k]=nm[k]; syncMeta.moodsTs[k]=Date.now(); metaTouched=true; });
        await saveMoodsEnc();
      }
      if(metaTouched) await saveSyncMetaEnc();
      if(added || metaTouched) markDirty();
      S.menuOpen=false; render(); flash(added+" Einträge importiert");
    } catch(err){ flash("Import fehlgeschlagen – ungültige Datei"); }
  }

  async function saveCats(next){
    S.cats = next;
    await saveCatsEnc();
    syncMeta.catsMod=Date.now(); await saveSyncMetaEnc(); markDirty();
    if(S.filter!=="all" && !S.cats.some(function(c){ return c.key===S.filter; })) S.filter="all";
    if(!S.cats.some(function(c){ return c.key===S.draftCat; })) S.draftCat = S.cats[0] ? S.cats[0].key : "privat";
  }
  function addCat(){
    var used = {}; S.cats.forEach(function(c){ used[c.color]=true; });
    var col = SWATCHES.find(function(s){ return !used[s]; }) || SWATCHES[0];
    var next = S.cats.concat([{ key:"c"+Date.now(), label:"Neue Kategorie", color:col }]);
    saveCats(next).then(render);
  }
  function renameCat(key, label){
    var c = S.cats.find(function(x){ return x.key===key; });
    if(c){ c.label = label; saveCatsEnc(); syncMeta.catsMod=Date.now(); saveSyncMetaEnc(); markDirty(); }
  }
  function recolorCat(key, color){
    var next = S.cats.map(function(c){ return c.key===key ? Object.assign({}, c, { color:color }) : c; });
    S.editColorFor=null; saveCats(next).then(render);
  }
  function removeCat(key){
    if(S.cats.length<=1){ flash("Mindestens eine Kategorie nötig"); return; }
    var next = S.cats.filter(function(c){ return c.key!==key; });
    S.confirmDel=null; saveCats(next).then(render);
  }

  // ---------- Drag-Sortierung (Pointer, touch-fähig) ----------
  var drag = null;
  appEl.addEventListener("pointerdown", function(e){
    if(S.view!=="cats") return;
    var h = e.target.closest("[data-draghandle]");
    if(!h) return;
    var card = h.closest(".cat-card");
    var listEl = document.getElementById("catList");
    if(!card || !listEl) return;
    e.preventDefault();
    drag = { card:card, list:listEl, pointerId:e.pointerId };
    card.classList.add("dragging");
    document.body.classList.add("dragging-active");
    try{ h.setPointerCapture(e.pointerId); }catch(_){}
  });
  appEl.addEventListener("pointermove", function(e){
    if(!drag) return;
    var y = e.clientY;
    var sibs = Array.prototype.slice.call(drag.list.querySelectorAll(".cat-card:not(.dragging)"));
    var after = null;
    for(var i=0;i<sibs.length;i++){
      var r = sibs[i].getBoundingClientRect();
      if(y < r.top + r.height/2){ after = sibs[i]; break; }
    }
    if(after) drag.list.insertBefore(drag.card, after);
    else drag.list.appendChild(drag.card);
  });
  function endDrag(){
    if(!drag) return;
    drag.card.classList.remove("dragging");
    document.body.classList.remove("dragging-active");
    var order = Array.prototype.map.call(drag.list.querySelectorAll(".cat-card"), function(c){ return c.getAttribute("data-key"); });
    var next = order.map(function(k){ return S.cats.find(function(c){ return c.key===k; }); }).filter(Boolean);
    drag = null;
    var changed = next.some(function(c,i){ return !S.cats[i] || S.cats[i].key!==c.key; });
    if(changed) saveCats(next).then(render); // sonst DOM ist schon korrekt, kein Re-Render nötig
  }
  appEl.addEventListener("pointerup", endDrag);
  appEl.addEventListener("pointercancel", endDrag);

  // ---------- Gate-Aktionen ----------
  function gateError(msg){
    S.gateErr = msg;
    var el = document.querySelector(".gate .err");
    if(el) el.textContent = msg; else render();
  }
  async function doSetup(){
    if(S.gateBusy) return;
    var p1=document.getElementById("pw1"), p2=document.getElementById("pw2");
    var a=p1?p1.value:"", b=p2?p2.value:"";
    if(a.length<6){ gateError("Mindestens 6 Zeichen."); return; }
    if(a!==b){ gateError("Passwörter stimmen nicht überein."); return; }
    S.gateBusy=true; S.gateErr=""; render();
    try{ await setupPassword(a); S.gateBusy=false; S.gate=null; S.view="calendar"; render(); }
    catch(e){ console.error(e); S.gateBusy=false; S.gateErr="Fehler beim Einrichten."; render(); }
  }
  async function doLogin(){
    if(S.gateBusy) return;
    var p1=document.getElementById("pw1"); var a=p1?p1.value:"";
    if(!a){ gateError("Bitte Passwort eingeben."); return; }
    S.gateBusy=true; S.gateErr=""; render();
    var ok=false; try{ ok=await unlock(a); }catch(e){ ok=false; }
    S.gateBusy=false;
    if(ok){ S.gate=null; S.view="calendar"; hiddenAt=0; render(); if(SY.cfg) syncNow("unlock"); }
    else { S.gateErr="Falsches Passwort."; render(); }
  }
  async function doChange(){
    if(S.gateBusy) return;
    var po=document.getElementById("pwo"), p1=document.getElementById("pw1"), p2=document.getElementById("pw2");
    var o=po?po.value:"", a=p1?p1.value:"", b=p2?p2.value:"";
    if(a.length<6){ gateError("Neues Passwort: mindestens 6 Zeichen."); return; }
    if(a!==b){ gateError("Neue Passwörter stimmen nicht überein."); return; }
    S.gateBusy=true; S.gateErr=""; render();
    var ok=false; try{ ok=await changePassword(o,a); }catch(e){ ok=false; }
    S.gateBusy=false;
    if(ok){ S.gate=null; render(); flash("Passwort geändert"); }
    else { S.gateErr="Aktuelles Passwort ist falsch."; render(); }
  }

  // ---------- Event-Delegation (Klicks) ----------
  appEl.addEventListener("click", function(ev){
    var t = ev.target.closest("[data-act],[data-day],[data-edit],[data-del],[data-chip],[data-mark-inc],[data-mark-dec],[data-mood],[data-goto],[data-colortoggle],[data-recolor],[data-catdel-ask],[data-catdel-yes],[data-catdel-no]");
    if(!t) return;

    if(t.hasAttribute("data-mark-inc")){ if(S.selected){ incMarker(S.selected, t.getAttribute("data-mark-inc"), 1); render(); } return; }
    if(t.hasAttribute("data-mark-dec")){ if(S.selected){ incMarker(S.selected, t.getAttribute("data-mark-dec"), -1); render(); } return; }
    if(t.hasAttribute("data-mood")){ if(S.selected){ setMood(S.selected, parseInt(t.getAttribute("data-mood"),10)); render(); } return; }
    if(t.hasAttribute("data-day")){ openDay(t.getAttribute("data-day")); return; }
    if(t.hasAttribute("data-edit")){ startEdit(t.getAttribute("data-edit")); return; }
    if(t.hasAttribute("data-del")){ deleteEntry(t.getAttribute("data-del")); return; }
    if(t.hasAttribute("data-goto")){
      var e = entries.find(function(x){ return x.id===t.getAttribute("data-goto"); });
      if(e){ openDay(e.date); }
      return;
    }
    if(t.hasAttribute("data-chip")){
      var k = t.getAttribute("data-chip");
      if(S.view==="calendar"){ S.filter = (S.filter===k ? "all" : k); }
      else if(S.view==="day"){ S.draftCat = k; }
      render(); return;
    }
    if(t.hasAttribute("data-colortoggle")){
      var ck = t.getAttribute("data-colortoggle");
      S.editColorFor = (S.editColorFor===ck ? null : ck); render(); return;
    }
    if(t.hasAttribute("data-recolor")){ recolorCat(t.getAttribute("data-recolor"), t.getAttribute("data-color")); return; }
    if(t.hasAttribute("data-catdel-ask")){ S.confirmDel=t.getAttribute("data-catdel-ask"); render(); return; }
    if(t.hasAttribute("data-catdel-yes")){ removeCat(t.getAttribute("data-catdel-yes")); return; }
    if(t.hasAttribute("data-catdel-no")){ S.confirmDel=null; render(); return; }

    switch(t.getAttribute("data-act")){
      case "open-search": S.view="search"; S.searchQ=""; S.searchRes=[]; render(); break;
      case "open-menu": S.menuOpen=true; render(); break;
      case "close-menu": S.menuOpen=false; render(); break;
      case "open-cats": S.view="cats"; S.menuOpen=false; S.editColorFor=null; S.confirmDel=null; render(); break;
      case "open-stats": openStats(); break;
      case "to-calendar": S.view="calendar"; S.editColorFor=null; S.confirmDel=null; render(); break;
      case "cal-prev": calShift(-1); break;
      case "cal-next": calShift(1); break;
      case "stats-prev": statsShift(-1); break;
      case "stats-next": statsShift(1); break;
      case "mode-month": S.calMode="month"; render(); break;
      case "mode-week": S.calMode="week"; render(); break;
      case "go-today": goToday(); break;
      case "toggle-otd": S.otdOpen=!S.otdOpen; render(); break;
      case "stats-mode-month": S.statsMode="month"; render(); break;
      case "stats-mode-year": S.statsMode="year"; render(); break;
      case "heat-entries": S.heatMetric="entries"; render(); break;
      case "heat-mood": S.heatMetric="mood"; render(); break;
      case "cancel-edit": cancelEdit(); break;
      case "add-cat": addCat(); break;
      case "export": exportJSON(); break;
      case "import": fileInput.click(); break;
      case "open-sync": S.view="sync"; S.menuOpen=false; S.syncTokenEdit=false; S.syncDetachAsk=false; render(); break;
      case "sync-token-edit": S.syncTokenEdit=true; render(); break;
      case "sync-detach-ask": S.syncDetachAsk=true; render(); break;
      case "sync-detach-no": S.syncDetachAsk=false; render(); break;
      case "sync-detach-yes":
        detachSync().then(function(){ S.syncDetachAsk=false; render(); flash("Online-Speicher getrennt"); });
        break;
      case "change-pw": S.gate="change"; S.gateErr=""; S.menuOpen=false; render(); break;
      case "lock": lock(); break;
      case "gate-cancel": S.gate=null; S.gateErr=""; render(); break;
    }
  });

  // Klicks im Sheet nicht durch die Backdrop schließen
  appEl.addEventListener("click", function(ev){
    if(ev.target.closest("#sheet") && !ev.target.closest("[data-act]")) ev.stopPropagation();
  }, true);

  // Mic/Send/Clear/Sync (eigene IDs)
  appEl.addEventListener("click", function(ev){
    if(ev.target.closest("#micBtn")){ toggleRec(); }
    else if(ev.target.closest("#sendBtn")){ submitEntry(); }
    else if(ev.target.closest("#searchClear")){ var i=document.getElementById("searchInput"); if(i){ i.value=""; runSearch(""); i.focus(); } }
    else if(ev.target.closest("#syncSetupBtn")){ doSyncSetup(); }
    else if(ev.target.closest("#syncTokenSave")){ doSyncTokenSave(); }
    else if(ev.target.closest("#syncNowBtn")){
      if(!SY.busy){ syncNow("manual").then(function(ok){ flash(ok ? "Synchronisiert" : "Sync fehlgeschlagen"); }); }
    }
  });

  // Online-Speicher: Einrichtung & Token-Wechsel (gezielte DOM-Updates statt Re-Render,
  // damit die Eingaben beim Anzeigen von Fehlern erhalten bleiben)
  var syncSetupBusy = false;
  async function doSyncSetup(){
    if(syncSetupBusy || SY.cfg) return;
    var rEl=document.getElementById("syncRepo"), tEl=document.getElementById("syncToken"), pEl=document.getElementById("syncPw");
    var errEl=document.getElementById("syncErr"), btn=document.getElementById("syncSetupBtn");
    syncSetupBusy=true;
    if(errEl) errEl.textContent="";
    if(btn){ btn.disabled=true; btn.textContent="Verbinde …"; }
    var err;
    try{ err = await setupSync(rEl&&rEl.value, tEl&&tEl.value, pEl&&pEl.value); }
    catch(e){ console.error(e); err="Unerwarteter Fehler bei der Einrichtung."; }
    syncSetupBusy=false;
    if(err){
      if(SY.cfg){                          // halb eingerichtet? Sauber zurückrollen
        await detachSync();
        if(S.view==="sync" && !S.gate) render();   // zurück zum Formular
      }
      var e2=document.getElementById("syncErr"); if(e2) e2.textContent=err;
      var b2=document.getElementById("syncSetupBtn"); if(b2){ b2.disabled=false; b2.textContent="Verbinden & synchronisieren"; }
    } else if(!S.gate){
      render(); flash("Online-Speicher verbunden");
    }
  }
  async function doSyncTokenSave(){
    if(!SY.cfg) return;
    var el=document.getElementById("syncNewToken");
    var v=el && el.value.trim();
    if(!v){ var e1=document.getElementById("syncErr"); if(e1) e1.textContent="Bitte den neuen Token eingeben."; return; }
    SY.cfg.token=v; await saveSyncCfgEnc();
    S.syncTokenEdit=false; SY.lastErr=""; render();
    syncNow("manual").then(function(ok){ flash(ok ? "Token aktualisiert" : "Token gespeichert – Sync fehlgeschlagen"); });
  }

  // Eingaben ohne Re-Render
  appEl.addEventListener("input", function(ev){
    var el = ev.target;
    if(el.id==="ta"){ S.draftText = el.value; autoGrow(el); }
    else if(el.id==="searchInput"){ runSearch(el.value); }
    else if(el.hasAttribute && el.hasAttribute("data-catname")){ renameCat(el.getAttribute("data-catname"), el.value); }
  });

  // Enter = senden
  appEl.addEventListener("keydown", function(ev){
    if(ev.target.id==="ta" && ev.key==="Enter" && !ev.shiftKey){ ev.preventDefault(); submitEntry(); }
  });

  // Gate: Buttons + Enter
  appEl.addEventListener("click", function(ev){
    if(ev.target.closest("#gateSetup")){ doSetup(); }
    else if(ev.target.closest("#gateLogin")){ doLogin(); }
    else if(ev.target.closest("#gateChange")){ doChange(); }
  });
  appEl.addEventListener("keydown", function(ev){
    if(!S.gate || ev.key!=="Enter") return;
    ev.preventDefault();
    if(S.gate==="setup") doSetup();
    else if(S.gate==="change") doChange();
    else doLogin();
  });

  // Swipe-Navigation: Tag (Detail) / Monat + Woche (Kalender)
  var sw = null;
  appEl.addEventListener("touchstart", function(e){
    if(S.gate){ sw=null; return; }
    if(!(S.view==="day" || S.view==="calendar")){ sw=null; return; }
    if(e.touches.length!==1){ sw=null; return; }
    if(e.target.closest("textarea,input,.chips,.seg,.swatches,.backdrop")){ sw=null; return; }
    var t=e.touches[0]; sw={ x:t.clientX, y:t.clientY, t:Date.now() };
  }, { passive:true });
  appEl.addEventListener("touchend", function(e){
    if(!sw) return;
    var t=e.changedTouches[0];
    var dx=t.clientX-sw.x, dy=t.clientY-sw.y, dt=Date.now()-sw.t;
    sw=null;
    if(dt>700) return;
    if(Math.abs(dx)<60 || Math.abs(dx) < Math.abs(dy)*1.7) return;
    var dir = dx<0 ? 1 : -1;   // links wischen -> vor, rechts -> zurück
    if(S.view==="day") shiftDay(dir);
    else if(S.view==="calendar") calShift(dir);
  }, { passive:true });

  // Datei-Import
  fileInput.addEventListener("change", function(ev){
    var f = ev.target.files && ev.target.files[0];
    if(f) importJSON(f);
    ev.target.value = "";
  });

  // ---------- Start ----------
  async function boot(){
    if(!subtle){
      appEl.innerHTML = '<div class="shell"><main class="gate">'+
        '<div class="gate-brand"><span class="b">Tagebuch</span></div>'+
        '<h1>Nicht verfügbar</h1>'+
        '<p class="lead">Dieser Browser stellt keine sichere Verschlüsselung (Web Crypto) bereit. Bitte die App über <b>HTTPS</b> öffnen und einen aktuellen Browser verwenden.</p>'+
        '</main></div>';
      return;
    }
    try{
      _db = await openDB();
      S.gate = (await hasAuth()) ? "login" : "setup";
    } catch(err){
      console.error("DB-Fehler:", err);
      S.gate = "setup";
      flash("Speicher nicht verfügbar.");
    }
    S.gateErr=""; render();
    if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(function(){}); }
    if("serviceWorker" in navigator){
      window.addEventListener("load", function(){
        navigator.serviceWorker.register("./service-worker.js").catch(function(e){ console.warn("SW:", e); });
      });
    }
    // Auto-Sperre nach Inaktivität im Hintergrund; Sync beim Wegschalten/Zurückkommen
    document.addEventListener("visibilitychange", function(){
      if(document.hidden){
        hiddenAt = Date.now();
        if(!S.gate && sessionKey && SY.cfg && SY.dirty){
          if(SY.timer){ clearTimeout(SY.timer); SY.timer=null; }
          syncNow("hide");
        }
      }
      else if(!S.gate && sessionKey && hiddenAt && (Date.now()-hiddenAt > AUTO_LOCK_MS)){ lock(); }
      else if(!S.gate && sessionKey && SY.cfg && (SY.dirty || Date.now()-SY.lastOk > SYNC_REFRESH_MS)){ syncNow("focus"); }
    });
    window.addEventListener("online", function(){
      if(!S.gate && sessionKey && SY.cfg) syncNow("online");
    });
  }
  boot();
})();
</script>
</body>
</html>
